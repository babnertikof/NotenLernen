<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NotenLernen</title>
    <link rel="stylesheet" href="style.css">
    <script defer src="./index.js"></script>
</head>
<body>
    <main>
      <div class="image-container">
        <img alt="Image of the note" width="183" height="154">
        <form class="input-container">
            <input type="text" aria-label="Note name" required>
            <button type="submit">Check</button>
        </form>
      </div>
      <section class="log-container" aria-label="Answer history">
          <h2>Answer log</h2>
          <ul class="logs"></ul>
      </section>
    </main>
</body>
</html>
